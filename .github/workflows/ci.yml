name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .. && ruff format --check ..
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resumetric .
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 7860:7860 resumetric
          for i in $(seq 1 20); do curl -fsS localhost:7860/health && break; sleep 1; done
          curl -fsS localhost:7860/ | grep -q ResuMetric
          docker logs app
